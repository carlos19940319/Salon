<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Administrador</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* =========================
   RESET Y BASE
========================= */
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100vh;
  font-family:Poppins, Arial, sans-serif;
  overflow-x:hidden; /* 🔥 evita desbordes globales */
}

body{
  background:
    radial-gradient(circle at top right, rgba(255,119,183,.35), transparent 55%),
    radial-gradient(circle at bottom left, rgba(255,47,146,.35), transparent 55%),
    linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)),
    url("img/fondo3.jpg");
  background-size:cover;
  background-position:center;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:16px;
}

/* =========================
   CARD PRINCIPAL
========================= */
.admin-card{
  width:100%;
  max-width:950px;

  /* 🌟 FONDO DEL PANEL */
  background:
    linear-gradient(
      rgba(255,255,255,.88),
      rgba(255,255,255,.88)
    ),
    url("img/fondo2.jpg");

  background-size:cover;
  background-position:center;

  border-radius:28px;
  padding:28px 30px;
  box-shadow:0 30px 70px rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
}
body.dark .admin-card{
  background:
    linear-gradient(
      rgba(25,25,25,.92),
      rgba(25,25,25,.92)
    ),
    url("https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=1400&q=80");
}



/* =========================
   HEADER
========================= */
.admin-header{
  text-align:center;
  margin-bottom:18px;
}
.admin-header h2{
  margin:0;
  font-size:28px;
  font-weight:900;
  background:linear-gradient(135deg,#ff2f92,#ff77b7);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.admin-header p{
  margin-top:6px;
  font-size:14px;
  color:#666;
}

/* =========================================
   📊 DASHBOARD PRO — NIVEL ADMIN / SAAS
========================================= */

.dashboard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-bottom:26px;
}

/* CARD BASE */
.dash-card{
  position:relative;
  padding:18px 16px;
  border-radius:20px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.95));
  backdrop-filter: blur(10px);
  box-shadow:
    0 12px 28px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.6);
  text-align:left;
  overflow:hidden;
  transition:.35s cubic-bezier(.22,.61,.36,1);
}

/* Efecto hover premium */
.dash-card:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:0 20px 45px rgba(0,0,0,.28);
}

/* Barra decorativa lateral */
.dash-card::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:6px;
  height:100%;
  border-radius:20px 0 0 20px;
  background:#e60073;
}

/* Texto */
.dash-card span{
  display:block;
  font-size:13px;
  font-weight:600;
  color:#666;
  margin-bottom:6px;
  letter-spacing:.3px;
}

.dash-card strong{
  font-size:34px;
  font-weight:900;
  line-height:1;
  color:#e60073;
}

/* Estados */
.dash-card.confirmada::before{
  background:linear-gradient(180deg,#2ecc71,#27ae60);
}
.dash-card.confirmada strong{
  color:#2ecc71;
}

.dash-card.pendiente::before{
  background:linear-gradient(180deg,#f1c40f,#f39c12);
}
.dash-card.pendiente strong{
  color:#f1c40f;
}

/* =========================================
   🌙 DARK MODE
========================================= */
body.dark .dash-card{
  background:
    linear-gradient(180deg,rgba(40,40,40,.85),rgba(25,25,25,.95));
  box-shadow:
    0 14px 32px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.08);
}

body.dark .dash-card span{
  color:#bbb;
}

/* =========================================
   📱 RESPONSIVE
========================================= */
@media (max-width:768px){
  .dashboard{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .dash-card{
    padding:16px 14px;
  }

  .dash-card strong{
    font-size:28px;
  }
}

@media (max-width:420px){
  .dashboard{
    grid-template-columns:1fr;
  }

  .dash-card{
    text-align:center;
  }

  .dash-card::before{
    width:100%;
    height:6px;
    top:auto;
    bottom:0;
    border-radius:0 0 20px 20px;
  }
}


/* =========================
   CALENDARIO
========================= */
.cal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
  padding:14px;
  border-radius:22px;
  background:
    linear-gradient(rgba(255,255,255,.6), rgba(255,255,255,.6)),
    url("img/fondo.jpg");
  background-size:cover;
  background-position:center;
}


/* =========================
   DÍA
========================= */
.cal-day{
  background:#fff;
  border-radius:14px;
  padding:6px;
  min-height:78px;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.cal-day.today{
  border:2px solid #ff2f92;
}

.cal-day h4{
  margin:0;
  font-size:11px;
  font-weight:800;
  color:#e60073;
}

.cal-day .dia-nombre{
  font-size:9px;
  color:#999;
}

/* =========================
   EVENTOS
========================= */
.event{
  margin-top:4px;
  font-size:9px;
  padding:4px 6px;
  border-radius:10px;
  color:#fff;
  line-height:1.1;
}
.event.confirmada{background:#2ecc71}
.event.pendiente{background:#f1c40f}
.event.cancelada{background:#e74c3c}

/* =========================
   FORMULARIO
========================= */
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.form-grid input,
.form-grid select{
  padding:12px;
  border-radius:14px;
  border:1px solid #ddd;
  font-size:14px;
}

.form-grid button{
  grid-column:1/-1;
  padding:14px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#ff2f92,#ff77b7);
  color:#fff;
  font-weight:900;
}
/* =========================
   📋 TABLA AUTO-ADAPTABLE + SCROLL (MOBILE FIRST)
========================= */

/* CONTENEDOR */
.table-wrap{
  width:100%;
  max-width:100%;
  overflow-x:auto;                 /* 🔥 scroll solo si hace falta */
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  margin-top:12px;
  padding:10px;
  border-radius:16px;
  background:rgba(255,255,255,.75);
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}

/* TABLA */
.table-wrap table{
  width:100%;
  border-collapse:collapse;
  table-layout:auto;
}

/* CELDAS */
.table-wrap th,
.table-wrap td{
  padding:10px 12px;
  font-size:13px;
  text-align:center;
  white-space:nowrap;
}

/* ENCABEZADO */
.table-wrap thead{
  background:linear-gradient(135deg,#fde7f1,#ffffff);
}

/* =========================
   📱 AJUSTE ESPECÍFICO CELULARES
========================= */
@media (max-width:768px){

  /* fuerza scroll SOLO en móvil */
  .table-wrap table{
    min-width:780px;               /* 👈 evita que se aplaste */
  }

  /* texto más legible */
  .table-wrap th,
  .table-wrap td{
    font-size:12px;
    padding:9px 10px;
  }

  /* efecto visual de scroll */
  .table-wrap{
    border:1px solid rgba(0,0,0,.08);
  }
}

/* =========================
   💻 ESCRITORIO
========================= */
@media (min-width:769px){
  .table-wrap{
    overflow-x:hidden;             /* 🔒 sin scroll en PC */
  }
}

/* ==================================================
   📱 FIX DEFINITIVO — UNIR PANELES EN MÓVIL
================================================== */
@media (max-width:768px){

  /* evita scroll lateral global */
  html, body{
    overflow-x:hidden;
  }

  /* el dashboard NO debe separarlos */
  .dashboard{
    gap:0;
  }

  /* todos los paneles se comportan como uno solo */

    margin:0;
    padding:16px 12px;

    box-shadow:none;
    background:transparent;
  }

  /* primer panel = borde superior */
  .panel-section:first-of-type{
    border-top-left-radius:18px;
    border-top-right-radius:18px;
  }

  /* último panel = borde inferior */
  .panel-section:last-of-type{
    border-bottom-left-radius:18px;
    border-bottom-right-radius:18px;

/* =========================
   🎞️ ANIMACIONES PRO CALENDARIO
========================= */
#calendar{
  will-change: transform, opacity;
}

/* Salida */
.calendar-exit-left{
  animation: calExitLeft .25s ease forwards;
}
.calendar-exit-right{
  animation: calExitRight .25s ease forwards;
}

/* Entrada */
.calendar-enter-left{
  animation: calEnterLeft .35s cubic-bezier(.22,.61,.36,1) forwards;
}
.calendar-enter-right{
  animation: calEnterRight .35s cubic-bezier(.22,.61,.36,1) forwards;
}

@keyframes calExitLeft{
  to{
    opacity:0;
    transform:translateX(-25px) scale(.98);
    filter:blur(2px);
  }
}
@keyframes calExitRight{
  to{
    opacity:0;
    transform:translateX(25px) scale(.98);
    filter:blur(2px);
  }
}

@keyframes calEnterLeft{
  from{
    opacity:0;
    transform:translateX(-30px) scale(.97);
    filter:blur(3px);
  }
  to{
    opacity:1;
    transform:translateX(0) scale(1);
    filter:blur(0);
  }
}
@keyframes calEnterRight{
  from{
    opacity:0;
    transform:translateX(30px) scale(.97);
    filter:blur(3px);
  }
  to{
    opacity:1;
    transform:translateX(0) scale(1);
    filter:blur(0);
  }
}

#dayModal{

/* =========================================
   📈 MINI SPARKLINE
========================================= */
.dash-spark{
  height:6px;
  width:100%;
  margin-top:10px;
  border-radius:6px;
  background:linear-gradient(
    90deg,
    rgba(230,0,115,.25),
    rgba(230,0,115,.65),
    rgba(230,0,115,.25)
  );
  background-size:200% 100%;
  animation:sparkMove 2.5s linear infinite;
}

@keyframes sparkMove{
  from{background-position:0%}
  to{background-position:200%}
}

/* Estados */
.dash-card.confirmada .dash-spark{
  background:linear-gradient(90deg,#2ecc71,#27ae60,#2ecc71);
}

.dash-card.pendiente .dash-spark{
  background:linear-gradient(90deg,#f1c40f,#f39c12,#f1c40f);
}
/* =========================================
   🔢 ICONOS ANIMADOS — DASHBOARD
========================================= */
.dash-card::after{
  content:'📅';
  position:absolute;
  right:16px;
  top:16px;
  font-size:28px;
  opacity:.18;
  transition:.4s ease;
}

.dash-card:hover::after{
  transform:rotate(-8deg) scale(1.15);
  opacity:.28;
}

/* Iconos por tipo */
.dash-card:nth-child(1)::after{content:'📆';} /* Hoy */
.dash-card:nth-child(2)::after{content:'📊';} /* Total */
.dash-card.confirmada::after{content:'✅';}
.dash-card.pendiente::after{content:'⏳';}

/* =========================================
   🔔 PULSO AL CAMBIAR NÚMERO
========================================= */
.pulse{
  animation:pulseGlow .55s ease;
}

@keyframes pulseGlow{
  0%{transform:scale(1);box-shadow:0 0 0 rgba(0,0,0,0)}
  50%{transform:scale(1.08);box-shadow:0 0 18px rgba(230,0,115,.55)}
  100%{transform:scale(1)}
}
/* =========================================
   🎯 INDICADOR HOY
========================================= */
.dash-card:first-child{
  position:relative;
}

.dash-card:first-child::before{
  background:linear-gradient(180deg,#ff2f92,#ff77b7);
}

.dash-card:first-child::after{
  content:'HOY';
  position:absolute;
  bottom:14px;
  right:14px;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  color:#ff2f92;
  animation:blinkToday 1.6s infinite;
}

@keyframes blinkToday{
  0%,100%{opacity:.4}
  50%{opacity:1}
}


</style> 






</head>



<body>

<div class="admin-card">

<div class="admin-header">
<h2>Panel Administrador</h2>
<p>Gestión de citas del salón</p>
<!-- Reloj en línea -->
<div class="reloj-linea">
  <span id="fechaActual"></span>
  <span class="separador">•</span>
  <span id="horaActual"></span>
</div>

</div>

<div class="login-box">
<input type="password" id="pass" placeholder="Contraseña admin">
<button onclick="login()">Entrar</button>
</div>

<div id="panel" class="hidden">

<div class="dashboard">
<div class="dash-card"><span>Hoy</span><strong id="d-hoy">0</strong></div>
<div class="dash-card"><span>Total</span><strong id="d-total">0</strong></div>
<div class="dash-card confirmada"><span>Confirmadas</span><strong id="d-ok">0</strong></div>
<div class="dash-card pendiente"><span>Pendientes</span><strong id="d-pend">0</strong></div>
</div>

<div class="panel-section">
<h3>Calendario</h3>
<div class="cal-head">
<button onclick="cambiarMes(-1)">◀</button>
<strong id="mesActual"></strong>
<button onclick="cambiarMes(1)">▶</button>
</div>
<div id="calendar"></div>
</div>

<div class="panel-section">
<h3>Nueva cita</h3>
<div class="form-grid">
<input id="nombre" placeholder="Cliente">
<input id="whatsapp" placeholder="WhatsApp (10 dígitos)">
<input type="date" id="fecha" onchange="cargarHorarios()">
<select id="hora"><option value="">Selecciona horario</option></select>
<select id="servicio">
<option>Manicure</option>
<option>Pedicure</option>
<option>Corte</option>
<option>Acrílicas</option>
</select>
<button onclick="crear()">Guardar cita</button>
</div>
</div>

<div class="panel-section">
  <h3>Citas registradas</h3>
  <input id="buscar" placeholder="Buscar cliente" oninput="cargar()">

  <!-- CONTENEDOR CON SCROLL -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>WhatsApp</th>
          <th>Servicio</th>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>
  </div>

</div>

<script>
/* ==================================================
   CONFIG
================================================== */
const PASS='123';
const HORARIOS=['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];
let mes=new Date().getMonth(), año=new Date().getFullYear();
let citaEditandoId=null;

const getCitas=()=>JSON.parse(localStorage.getItem('citas'))||[];
const guardar=c=>localStorage.setItem('citas',JSON.stringify(c));

/* ==================================================
   LOGIN
================================================== */
function login(){
  if(document.getElementById('pass').value!==PASS){
    alert('Contraseña incorrecta');
    return;
  }
  document.querySelector('.login-box').style.display='none';
  document.getElementById('panel').classList.remove('hidden');
  cargar();
  renderCalendar(1);
  actualizarReloj();
}

/* ==================================================
   HORARIOS
================================================== */
function cargarHorarios(){
 const fecha=document.getElementById('fecha').value;
 const select=document.getElementById('hora');
 select.innerHTML='<option value="">Selecciona horario</option>';
 HORARIOS.forEach(h=>{
  if(!getCitas().some(c=>c.fecha===fecha && c.hora===h)){
    select.innerHTML+=`<option>${h}</option>`;
  }
 });
}

/* ==================================================
   CREAR / EDITAR CITA
================================================== */
function crear(){
 let citas=getCitas();
 const nombre=document.getElementById('nombre').value;
 const whatsapp=document.getElementById('whatsapp').value;
 const fecha=document.getElementById('fecha').value;
 const hora=document.getElementById('hora').value;
 const servicio=document.getElementById('servicio').value;

 if(!nombre||!whatsapp||!fecha||!hora)
   return alert('Completa todos los campos');

 if(citaEditandoId){
   const c=citas.find(x=>x.id===citaEditandoId);
   if(!c) return;

   c.nombre=nombre;
   c.whatsapp=whatsapp;
   c.fecha=fecha;
   c.hora=hora;
   c.servicio=servicio;

   citaEditandoId=null;
 }else{
   citas.push({
     id:Date.now(),
     nombre,
     whatsapp,
     servicio,
     fecha,
     hora,
     estado:'pendiente'
   });
 }

 guardar(citas);
 cargar();
 renderCalendar(1);

 document.getElementById('nombre').value='';
 document.getElementById('whatsapp').value='';
 document.getElementById('fecha').value='';
 document.getElementById('hora').value='';
}

/* ==================================================
   TABLA
================================================== */
function cargar(){
 let citas=getCitas();
 const buscar=document.getElementById('buscar').value.toLowerCase();
 citas=citas.filter(c=>c.nombre.toLowerCase().includes(buscar));
 actualizarDashboard(citas);

 const tabla=document.getElementById('tabla');
 tabla.innerHTML='';
 citas.forEach(c=>{
  tabla.innerHTML+=`
  <tr>
   <td>${c.nombre}</td>
   <td>${c.whatsapp}</td>
   <td>${c.servicio}</td>
   <td>${c.fecha}</td>
   <td>${c.hora}</td>
   <td>
    <select onchange="estado(${c.id},this.value)">
     <option ${c.estado==='pendiente'?'selected':''}>pendiente</option>
     <option ${c.estado==='confirmada'?'selected':''}>confirmada</option>
     <option ${c.estado==='cancelada'?'selected':''}>cancelada</option>
    </select>
   </td>
   <td>
    <button class="btn-wa" onclick="wa(${c.id})">📲</button>
    <button class="btn-delete" onclick="eliminar(${c.id})">🗑</button>
   </td>
  </tr>`;
 });
}

/* ==================================================
   ESTADO
================================================== */
function estado(id,val){
 let citas=getCitas();
 let c=citas.find(x=>x.id===id);
 c.estado=val;
 guardar(citas);
 cargar();
 renderCalendar(1);

 if(val==='confirmada'||val==='cancelada'){
  const msg=`Hola ${c.nombre} 👋
Tu cita de ${c.servicio}
📅 ${c.fecha}
⏰ ${c.hora}
ha sido ${val}. 💖`;
  window.open(`https://wa.me/52${c.whatsapp}?text=${encodeURIComponent(msg)}`);
 }
}

function wa(id){
 const c=getCitas().find(x=>x.id===id);
 const msg=`Hola ${c.nombre}, tu cita de ${c.servicio} el ${c.fecha} a las ${c.hora} está ${c.estado}. 💖`;
 window.open(`https://wa.me/52${c.whatsapp}?text=${encodeURIComponent(msg)}`);
}

function eliminar(id){
 if(!confirm('¿Eliminar cita?'))return;
 guardar(getCitas().filter(c=>c.id!==id));
 cargar();
 renderCalendar(1);
}

/* ==================================================
   DASHBOARD
================================================== */
function actualizarDashboard(c){
 const hoy=new Date().toISOString().split('T')[0];
 document.getElementById('d-hoy').textContent=c.filter(x=>x.fecha===hoy).length;
 document.getElementById('d-total').textContent=c.length;
 document.getElementById('d-ok').textContent=c.filter(x=>x.estado==='confirmada').length;
 document.getElementById('d-pend').textContent=c.filter(x=>x.estado==='pendiente').length;
}

/* ==================================================
   CALENDARIO SLIDE
================================================== */
function cambiarMes(dir){
 mes+=dir;
 if(mes<0){mes=11;año--}
 if(mes>11){mes=0;año++}
 renderCalendar(dir);
}

function renderCalendar(dir=1){
 const calendar=document.getElementById('calendar');
 const mesActual=document.getElementById('mesActual');

 calendar.className='';
 calendar.classList.add(dir>0?'calendar-exit-left':'calendar-exit-right');

 setTimeout(()=>{
  calendar.innerHTML='';
  mesActual.textContent=
    new Date(año,mes).toLocaleDateString('es-MX',{month:'long',year:'numeric'});

  const inicio=new Date(año,mes,1).getDay();
  const dias=new Date(año,mes+1,0).getDate();
  const hoy=new Date().toISOString().split('T')[0];

  for(let i=0;i<inicio;i++) calendar.innerHTML+='<div></div>';

  for(let d=1;d<=dias;d++){
    const fecha=`${año}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const eventos=getCitas().filter(c=>c.fecha===fecha);
    const esHoy=fecha===hoy?'today':'';
    const nombreDia=new Date(año,mes,d)
      .toLocaleDateString('es-MX',{weekday:'short'});

    calendar.innerHTML+=`
      <div class="cal-day ${esHoy}" onclick="abrirDia('${fecha}')">
        <div class="dia-nombre">${nombreDia}</div>
        <h4>${d}</h4>
        ${eventos.map(e=>`
          <div class="event ${e.estado}">
            ${e.hora} ${e.nombre}
          </div>`).join('')}
      </div>`;
  }

  calendar.className='';
  calendar.classList.add(dir>0?'calendar-enter-right':'calendar-enter-left');
 },220);
}

/* ==================================================
   RELOJ EN TIEMPO REAL (RESTAURADO)
================================================== */
function actualizarReloj(){
 const ahora=new Date();
 const fecha=document.getElementById('fechaActual');
 const hora=document.getElementById('horaActual');
 if(!fecha||!hora) return;

 fecha.textContent=ahora.toLocaleDateString('es-MX',{
   weekday:'long',day:'numeric',month:'long',year:'numeric'
 }).replace(/^./,m=>m.toUpperCase());

 hora.textContent=ahora.toLocaleTimeString('es-MX',{
   hour:'2-digit',minute:'2-digit',second:'2-digit'
 });
}
setInterval(actualizarReloj,1000);

/* ==================================================
   MODO OSCURO
================================================== */
function activarModoOscuro(){
 const h=new Date().getHours();
 if(h>=19||h<=6) document.body.classList.add('dark');
}
activarModoOscuro();

/* ==================================================
   DÍA EXPANDIDO
================================================== */
function abrirDia(fecha){
 const citas=getCitas().filter(c=>c.fecha===fecha);
 const modal=document.getElementById('dayModal');
 const title=document.getElementById('dayModalTitle');
 const content=document.getElementById('dayModalContent');

 title.textContent=new Date(fecha)
  .toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'})
  .replace(/^./,m=>m.toUpperCase());

 content.innerHTML=citas.length
 ? citas.map(c=>`
   <div class="day-item ${c.estado}">
     <strong>${c.hora} — ${c.nombre}</strong><br>
     ${c.servicio}<br>
     📲 ${c.whatsapp}
     <div class="day-actions">
       <button onclick="editarCitaDia(${c.id})">✏️ Editar</button>
       <button onclick="wa(${c.id})">📲 Whats</button>
       <button onclick="eliminarDesdeDia(${c.id})">🗑</button>
     </div>
   </div>`).join('')
 : '<p style="text-align:center">Sin citas</p>';

 modal.classList.remove('hidden');
}

function cerrarDia(){
 document.getElementById('dayModal').classList.add('hidden');
}

/* ==================================================
   EDITAR / ELIMINAR DESDE DÍA
================================================== */
function editarCitaDia(id){
 const c=getCitas().find(x=>x.id===id);
 if(!c) return;

 citaEditandoId=id;
 document.getElementById('nombre').value=c.nombre;
 document.getElementById('whatsapp').value=c.whatsapp;
 document.getElementById('fecha').value=c.fecha;
 document.getElementById('hora').value=c.hora;
 document.getElementById('servicio').value=c.servicio;

 cerrarDia();
 window.scrollTo({top:0,behavior:'smooth'});
}

function eliminarDesdeDia(id){
 if(!confirm('¿Eliminar esta cita?')) return;
 guardar(getCitas().filter(c=>c.id!==id));
 cerrarDia();
 cargar();
 renderCalendar(1);
}
/* ==================================================
   📱 SWIPE PARA CAMBIAR MES (NO ROMPE NADA)
================================================== */
(function activarSwipeCalendario(){
  const calendar = document.getElementById('calendar');
  if(!calendar) return;

  let startX = 0;
  let endX = 0;

  calendar.addEventListener('touchstart', e => {
    startX = e.changedTouches[0].screenX;
  }, {passive:true});

  calendar.addEventListener('touchend', e => {
    endX = e.changedTouches[0].screenX;
    const diff = endX - startX;

    if(Math.abs(diff) > 60){
      if(diff < 0){
        cambiarMes(1);   // 👉 swipe izquierda = mes siguiente
      }else{
        cambiarMes(-1);  // 👉 swipe derecha = mes anterior
      }
    }
  }, {passive:true});
})();
/* ==================================================
   📤 EXPORTAR CITAS DEL DÍA (EXCEL / PDF)
================================================== */
let fechaDiaAbierto = null;

// guarda la fecha cuando se abre el modal
const abrirDiaOriginal = abrirDia;
abrirDia = function(fecha){
  fechaDiaAbierto = fecha;
  abrirDiaOriginal(fecha);
};

// ---------- EXCEL ----------
function exportarDiaExcel(){
  if(!fechaDiaAbierto) return alert('No hay día seleccionado');

  const citas = getCitas().filter(c => c.fecha === fechaDiaAbierto);
  if(!citas.length) return alert('No hay citas');

  let csv = 'Hora,Cliente,Servicio,WhatsApp,Estado\n';
  citas.forEach(c=>{
    csv += `${c.hora},${c.nombre},${c.servicio},${c.whatsapp},${c.estado}\n`;
  });

  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `citas_${fechaDiaAbierto}.csv`;
  link.click();
}

// ---------- PDF ----------
function exportarDiaPDF(){
  if(!fechaDiaAbierto) return alert('No hay día seleccionado');

  const citas = getCitas().filter(c => c.fecha === fechaDiaAbierto);
  if(!citas.length) return alert('No hay citas');

  let contenido = `Citas del ${fechaDiaAbierto}\n\n`;
  citas.forEach(c=>{
    contenido += `${c.hora} - ${c.nombre} (${c.servicio}) - ${c.estado}\n`;
  });

  const win = window.open('', '_blank');
  win.document.write(`<pre>${contenido}</pre>`);
  win.print();
}

/* ==================================================
   🔔 RECORDATORIOS AUTOMÁTICOS (WHATSAPP)
================================================== */
function enviarRecordatorios(){
  const ahora = new Date();
  const hoy = ahora.toISOString().split('T')[0];

  const citasHoy = getCitas().filter(c =>
    c.fecha === hoy && c.estado === 'confirmada'
  );

  citasHoy.forEach(c=>{
    const [h,m] = c.hora.split(':');
    const horaCita = new Date();
    horaCita.setHours(h, m, 0, 0);

    const diffMin = (horaCita - ahora) / 60000;

    // ⏰ 60 minutos antes
    if(diffMin > 55 && diffMin < 65){
      const msg = `Hola ${c.nombre} 👋
Te recordamos tu cita de ${c.servicio}
🕒 ${c.hora}
📅 Hoy 💖`;

      window.open(
        `https://wa.me/52${c.whatsapp}?text=${encodeURIComponent(msg)}`,
        '_blank'
      );
    }
  });
}

// revisar cada 10 minutos
setInterval(enviarRecordatorios, 600000);


</script>


<!-- 🔍 MODAL DÍA EXPANDIDO -->
<div id="dayModal" class="hidden">
  <div class="day-modal-card">

    <div class="day-modal-header">
      <h3 id="dayModalTitle"></h3>
      <button onclick="cerrarDia()">✕</button>
    </div>

    <!-- CONTENIDO DE CITAS DEL DÍA -->
    <div id="dayModalContent" class="day-modal-content"></div>

    <!-- 📤 EXPORTAR CITAS DEL DÍA -->
    <div class="day-export">
      <button onclick="exportarDiaExcel()">📊 Exportar Excel</button>
      <button onclick="exportarDiaPDF()">📄 Exportar PDF</button>
    </div>

  </div>
</div>


</body>
</html>
