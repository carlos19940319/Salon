<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Administrador</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* =========================
   RESET Y BASE
========================= */
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Poppins, Arial, sans-serif;

  background:
    radial-gradient(circle at top right, rgba(255,119,183,.35), transparent 55%),
    radial-gradient(circle at bottom left, rgba(255,47,146,.35), transparent 55%),
    linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)),
    url("https://images.unsplash.com/photo-1523961131990-5ea7c61b2107?auto=format&fit=crop&w=1800&q=80");

  background-size:cover;
  background-position:center;

  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

/* ✅ MEDIA QUERY FUERA */
@media (max-width:768px){
  body{
    background-attachment:scroll;
    padding:0;
  }
}


/* =========================
   TARJETA PRINCIPAL (GLASS)
========================= */
.admin-card{
  width:100%;
  max-width:950px;

  background:rgba(255,255,255,0.93);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border-radius:30px;
  border:1px solid rgba(255,255,255,.45);

  box-shadow:
    0 35px 80px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.7);

  padding:34px 44px;
}

/* =========================
   📱 MOBILE FIX
========================= */
@media(max-width:768px){
  body{
    padding:0;
  }

  .admin-card{
    border-radius:0;
    min-height:auto;   /* 🔥 CLAVE */
    padding:26px 18px;
  }
}


/* =========================
   HEADER
========================= */
.admin-header{
  text-align:center;
  margin-bottom:30px;
}
.admin-header h2{
  margin:0;
  font-size:32px;
  font-weight:900;
  background:linear-gradient(135deg,#ff2f92,#ff77b7);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:.5px;
}
.admin-header p{
  margin-top:8px;
  color:#555;
  font-size:15px;
}

/* =========================
   LOGIN
========================= */
.login-box{
  display:flex;
  gap:14px;
  justify-content:center;
  margin:28px 0;
  flex-wrap:wrap;
}
.login-box input{
  padding:15px 18px;
  border-radius:18px;
  border:1px solid #ddd;
  font-size:16px;
  min-width:220px;
}
.login-box button{
  background:linear-gradient(135deg,#ff2f92,#ff77b7);
  color:#fff;
  border:none;
  padding:15px 26px;
  border-radius:18px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 10px 22px rgba(255,47,146,.45);
  transition:.25s;
}
.login-box button:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 30px rgba(255,47,146,.6);
}

.hidden{display:none}

/* =========================
   DASHBOARD
========================= */
.dashboard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:20px;
  margin-bottom:36px;
}

.dash-card{
  background:
    linear-gradient(135deg,#ffffff,#fde7f1);
  border-radius:24px;
  padding:24px 18px;
  text-align:center;
  position:relative;

  box-shadow:
    0 18px 40px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.dash-card span{
  font-size:14px;
  color:#777;
}
.dash-card strong{
  display:block;
  font-size:36px;
  font-weight:900;
  color:#e60073;
}

.dash-card.confirmada strong{color:#2ecc71}
.dash-card.pendiente strong{color:#f1c40f}

/* =========================
   FORMULARIO
========================= */
.panel-section{margin-top:34px}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:16px;
  margin-bottom:24px;
}

.form-grid input,
.form-grid select{
  padding:15px;
  border-radius:18px;
  border:1px solid #ddd;
  font-size:15px;
}

.form-grid button{
  grid-column:1/-1;
  background:linear-gradient(135deg,#ff2f92,#ff77b7);
  color:#fff;
  border:none;
  padding:17px;
  border-radius:22px;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 14px 26px rgba(255,47,146,.45);
}

/* =========================
   TABLA
========================= */
#buscar{
  width:100%;
  padding:15px;
  border-radius:18px;
  border:1px solid #ddd;
  margin-bottom:18px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:14px;
  overflow:hidden;
  border-radius:20px;
}

thead{
  background:linear-gradient(135deg,#fde7f1,#ffffff);
}
th,td{
  padding:14px;
  text-align:center;
  font-size:14px;
}
tbody tr:nth-child(even){background:#fafafa}

.btn-delete{
  background:#ff4d4d;
  color:#fff;
  border:none;
  padding:6px 14px;
  border-radius:14px;
  cursor:pointer;
}
.btn-wa{
  background:#25D366;
  color:#fff;
  border:none;
  padding:6px 14px;
  border-radius:14px;
  cursor:pointer;
}

/* =========================
   CALENDARIO
========================= */
.cal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}
.cal-head button{
  background:linear-gradient(135deg,#ff2f92,#ff77b7);
  color:#fff;
  border:none;
  padding:9px 16px;
  border-radius:14px;
  cursor:pointer;
}

#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:12px;

  /* 🌸 FONDO DEL CALENDARIO */
  background:
    linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,.55)),
    url("https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=1600&q=80");

  background-size:cover;
  background-position:center;

  padding:18px;
  border-radius:26px;

  box-shadow:
    0 20px 45px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.7);
}
.cal-day{
  background:rgba(255,255,255,.93);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);

  border-radius:18px;
  padding:12px;
  min-height:115px;

  box-shadow:
    0 8px 18px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.9);

  transition:.25s;
}

.cal-day:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 26px rgba(0,0,0,.25);
}


.cal-day:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 26px rgba(0,0,0,.25);
}



.cal-day h4{
  margin:0;
  font-size:12px;
  color:#e60073;
}
.cal-day .dia-nombre{
  font-size:10px;
  text-transform:capitalize;
  color:#888;
  margin-bottom:2px;
}

.event{
  margin-top:6px;
  font-size:11px;
  padding:5px 9px;
  border-radius:12px;
  color:#fff;
}
.event.pendiente{background:#f1c40f}
.event.confirmada{background:#2ecc71}
.event.cancelada{background:#e74c3c}


/* =========================
   RELOJ EN LÍNEA
========================= */
.reloj-linea{
  margin-top:10px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;

  font-size:15px;
  font-weight:600;
  color:#555;

  background:rgba(255,255,255,.6);
  backdrop-filter: blur(6px);
  padding:6px 14px;
  border-radius:14px;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
}

.reloj-linea .separador{
  opacity:.5;
}

#horaActual{
  font-weight:800;
  color:#e60073;
}
.cal-day.today{
  border:2px solid #ff2f92;
}
/* =========================
   ANIMACIÓN CAMBIO DE MES
========================= */
#calendar{
  transition: opacity .35s ease, transform .35s ease;
}

#calendar.fade-out{
  opacity:0;
  transform:translateY(10px);
}

#calendar.fade-in{
  opacity:1;
  transform:translateY(0);
}
/* =========================
   MODO OSCURO
========================= */
body.dark{
  background:
    linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.7)),
    url("https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=1800&q=80");
}

body.dark .admin-card{
  background:rgba(20,20,20,.92);
  color:#eee;
}

body.dark input,
body.dark select,
body.dark table,
body.dark .cal-day{
  background:rgba(40,40,40,.9);
  color:#eee;
}

body.dark .event{
  opacity:.9;
}
/* =========================
   📱 VISTA AGENDA MÓVIL
========================= */
@media(max-width:768px){
  #calendar{
    display:flex;
    flex-direction:column;
  }

  .cal-day{
    display:flex;
    align-items:flex-start;
    gap:12px;
  }

  .cal-day .dia-nombre{
    font-size:12px;
    font-weight:700;
  }

  .cal-day h4{
    font-size:20px;
    min-width:32px;
  }
}

/* =========================
   🔔 DÍA MÁS OCUPADO
========================= */
.cal-day.mas-ocupado{
  border:2px solid #ff9800;
  position:relative;
}

.cal-day.mas-ocupado::after{
  content:"🔥";
  position:absolute;
  top:6px;
  right:8px;
  font-size:16px;
}

/* =========================
   ⏰ LÍNEA DE HORA ACTUAL
========================= */
.linea-hora{
  height:2px;
  background:#e60073;
  margin:6px 0;
  border-radius:2px;
}

/* =========================
   🌙 AJUSTES MODO OSCURO
========================= */
body.dark .cal-day.today{
  border-color:#ff77b7;
}

body.dark .reloj-linea{
  background:rgba(40,40,40,.7);
  color:#eee;
}




</style>


</head>



<body>

<div class="admin-card">

<div class="admin-header">
<h2>Panel Administrador</h2>
<p>Gestión de citas del salón</p>
<!-- Reloj en línea -->
<div class="reloj-linea">
  <span id="fechaActual"></span>
  <span class="separador">•</span>
  <span id="horaActual"></span>
</div>

</div>

<div class="login-box">
<input type="password" id="pass" placeholder="Contraseña admin">
<button onclick="login()">Entrar</button>
</div>

<div id="panel" class="hidden">

<div class="dashboard">
<div class="dash-card"><span>Hoy</span><strong id="d-hoy">0</strong></div>
<div class="dash-card"><span>Total</span><strong id="d-total">0</strong></div>
<div class="dash-card confirmada"><span>Confirmadas</span><strong id="d-ok">0</strong></div>
<div class="dash-card pendiente"><span>Pendientes</span><strong id="d-pend">0</strong></div>
</div>

<div class="panel-section">
<h3>Calendario</h3>
<div class="cal-head">
<button onclick="cambiarMes(-1)">◀</button>
<strong id="mesActual"></strong>
<button onclick="cambiarMes(1)">▶</button>
</div>
<div id="calendar"></div>
</div>

<div class="panel-section">
<h3>Nueva cita</h3>
<div class="form-grid">
<input id="nombre" placeholder="Cliente">
<input id="whatsapp" placeholder="WhatsApp (10 dígitos)">
<input type="date" id="fecha" onchange="cargarHorarios()">
<select id="hora"><option value="">Selecciona horario</option></select>
<select id="servicio">
<option>Manicure</option>
<option>Pedicure</option>
<option>Corte</option>
<option>Acrílicas</option>
</select>
<button onclick="crear()">Guardar cita</button>
</div>
</div>

<div class="panel-section">
<h3>Citas registradas</h3>
<input id="buscar" placeholder="Buscar cliente" oninput="cargar()">
<table>
<thead>
<tr>
<th>Cliente</th>
<th>WhatsApp</th>
<th>Servicio</th>
<th>Fecha</th>
<th>Hora</th>
<th>Estado</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>
</div>

</div>
</div>

<script>
const PASS='12345678910';
const HORARIOS=['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];
let mes=new Date().getMonth(), año=new Date().getFullYear();

const getCitas=()=>JSON.parse(localStorage.getItem('citas'))||[];
const guardar=c=>localStorage.setItem('citas',JSON.stringify(c));

function login(){
  if(document.getElementById('pass').value!==PASS){
    alert('Contraseña incorrecta');
    return;
  }
  document.querySelector('.login-box').style.display='none';
  document.getElementById('panel').classList.remove('hidden');
  cargar();
  renderCalendar();
}

/* =========================
   HORARIOS
========================= */
function cargarHorarios(){
 const fecha=document.getElementById('fecha').value;
 const select=document.getElementById('hora');
 select.innerHTML='<option value="">Selecciona horario</option>';
 HORARIOS.forEach(h=>{
  if(!getCitas().some(c=>c.fecha===fecha && c.hora===h)){
    select.innerHTML+=`<option>${h}</option>`;
  }
 });
}

/* =========================
   CREAR CITA
========================= */
function crear(){
 let citas=getCitas();
 const nombre=document.getElementById('nombre').value;
 const whatsapp=document.getElementById('whatsapp').value;
 const fecha=document.getElementById('fecha').value;
 const hora=document.getElementById('hora').value;
 const servicio=document.getElementById('servicio').value;

 if(!nombre||!whatsapp||!fecha||!hora)
   return alert('Completa todos los campos');

 citas.push({id:Date.now(),nombre,whatsapp,servicio,fecha,hora,estado:'pendiente'});
 guardar(citas);
 cargar();
 renderCalendar();
}

/* =========================
   CARGAR TABLA
========================= */
function cargar(){
 let citas=getCitas();
 const buscar=document.getElementById('buscar').value.toLowerCase();
 citas=citas.filter(c=>c.nombre.toLowerCase().includes(buscar));
 actualizarDashboard(citas);

 const tabla=document.getElementById('tabla');
 tabla.innerHTML='';
 citas.forEach(c=>{
  tabla.innerHTML+=`
  <tr>
   <td>${c.nombre}</td>
   <td>${c.whatsapp}</td>
   <td>${c.servicio}</td>
   <td>${c.fecha}</td>
   <td>${c.hora}</td>
   <td>
    <select onchange="estado(${c.id},this.value)">
     <option ${c.estado==='pendiente'?'selected':''}>pendiente</option>
     <option ${c.estado==='confirmada'?'selected':''}>confirmada</option>
     <option ${c.estado==='cancelada'?'selected':''}>cancelada</option>
    </select>
   </td>
   <td>
    <button class="btn-wa" onclick="wa(${c.id})">📲</button>
    <button class="btn-delete" onclick="eliminar(${c.id})">🗑</button>
   </td>
  </tr>`;
 });
}

/* =========================
   ESTADO
========================= */
function estado(id,val){
 let citas=getCitas();
 let c=citas.find(x=>x.id===id);
 c.estado=val;
 guardar(citas);
 cargar();
 renderCalendar();

 if(val==='confirmada'||val==='cancelada'){
  const msg=`Hola ${c.nombre} 👋
Tu cita de ${c.servicio}
📅 ${c.fecha}
⏰ ${c.hora}
ha sido ${val}. 💖`;
  window.open(`https://wa.me/52${c.whatsapp}?text=${encodeURIComponent(msg)}`);
 }
}

function wa(id){
 const c=getCitas().find(x=>x.id===id);
 const msg=`Hola ${c.nombre}, tu cita de ${c.servicio} el ${c.fecha} a las ${c.hora} está ${c.estado}. 💖`;
 window.open(`https://wa.me/52${c.whatsapp}?text=${encodeURIComponent(msg)}`);
}

function eliminar(id){
 if(!confirm('¿Eliminar cita?'))return;
 guardar(getCitas().filter(c=>c.id!==id));
 cargar();
 renderCalendar();
}

/* =========================
   DASHBOARD
========================= */
function actualizarDashboard(c){
 const hoy=new Date().toISOString().split('T')[0];
 document.getElementById('d-hoy').textContent=c.filter(x=>x.fecha===hoy).length;
 document.getElementById('d-total').textContent=c.length;
 document.getElementById('d-ok').textContent=c.filter(x=>x.estado==='confirmada').length;
 document.getElementById('d-pend').textContent=c.filter(x=>x.estado==='pendiente').length;
}

/* =========================
   CAMBIAR MES
========================= */
function cambiarMes(dir){
 mes+=dir;
 if(mes<0){mes=11;año--}
 if(mes>11){mes=0;año++}
 renderCalendar();
}

/* =========================
   CALENDARIO (ANIMADO + DÍA)
========================= */
function renderCalendar(){
 const calendar=document.getElementById('calendar');
 const mesActual=document.getElementById('mesActual');

 /* animación salida */
 calendar.classList.remove('fade-in');
 calendar.classList.add('fade-out');

 setTimeout(()=>{
  calendar.innerHTML='';
  mesActual.textContent=
    new Date(año,mes).toLocaleDateString('es-MX',{month:'long',year:'numeric'});

  const inicio=new Date(año,mes,1).getDay();
  const dias=new Date(año,mes+1,0).getDate();
  const hoy=new Date().toISOString().split('T')[0];

  for(let i=0;i<inicio;i++) calendar.innerHTML+='<div></div>';

  for(let d=1;d<=dias;d++){
    const fecha=`${año}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const eventos=getCitas().filter(c=>c.fecha===fecha);
    const esHoy = fecha===hoy ? 'today' : '';
    const nombreDia=new Date(año,mes,d)
      .toLocaleDateString('es-MX',{weekday:'short'});

    calendar.innerHTML+=`
      <div class="cal-day ${esHoy}">
        <div class="dia-nombre">${nombreDia}</div>
        <h4>${d}</h4>
        ${eventos.map(e=>`
          <div class="event ${e.estado}">
            ${e.hora} ${e.nombre}
          </div>`).join('')}
      </div>`;
  }

  /* animación entrada */
  calendar.classList.remove('fade-out');
  calendar.classList.add('fade-in');

 },180);
}

/* =========================
   RELOJ EN TIEMPO REAL
========================= */
function actualizarReloj(){
  const ahora=new Date();
  document.getElementById('fechaActual').textContent =
    ahora.toLocaleDateString('es-MX',{
      weekday:'long',day:'numeric',month:'long',year:'numeric'
    }).replace(/^./,m=>m.toUpperCase());

  document.getElementById('horaActual').textContent =
    ahora.toLocaleTimeString('es-MX',{
      hour:'2-digit',minute:'2-digit',second:'2-digit'
    });
}

actualizarReloj();
setInterval(actualizarReloj,1000);
function activarModoOscuro(){
  const hora=new Date().getHours();
  if(hora>=19 || hora<=6){
    document.body.classList.add('dark');
  }
}

activarModoOscuro();

</script>



</body>
</html>
