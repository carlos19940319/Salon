<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Administrador</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ===== ESTILO ADMIN PRO ===== */
body{
  margin:0;
  font-family:Poppins, Arial, sans-serif;
  background:linear-gradient(135deg,#ff2f92,#ff77b7);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.admin-card{
  background:#fff;
  width:100%;
  max-width:900px;
  border-radius:24px;
  box-shadow:0 20px 45px rgba(0,0,0,.25);
  padding:30px 40px;
}

.admin-header{
  text-align:center;
  margin-bottom:25px;
}

.admin-header h2{
  margin:0;
  font-size:28px;
  font-weight:800;
  color:#e60073;
}

.admin-header p{
  margin-top:6px;
  color:#666;
}

/* LOGIN */
.login-box{
  display:flex;
  gap:10px;
  justify-content:center;
  margin:25px 0;
}

.login-box input{
  padding:12px 16px;
  border-radius:14px;
  border:1px solid #ddd;
  font-size:16px;
}

.login-box button{
  background:#e60073;
  color:#fff;
  border:none;
  padding:12px 20px;
  border-radius:14px;
  font-weight:600;
  cursor:pointer;
}

/* PANEL */
.hidden{display:none;}

.panel-section{
  margin-top:30px;
}

.panel-section h3{
  margin-bottom:12px;
  color:#333;
}

/* FORM */
.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-bottom:20px;
}

.form-grid input,
.form-grid select{
  padding:12px;
  border-radius:14px;
  border:1px solid #ddd;
  font-size:15px;
}

.form-grid button{
  grid-column:1/-1;
  background:linear-gradient(135deg,#ff2f92,#ff77b7);
  color:#fff;
  border:none;
  padding:14px;
  border-radius:18px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

/* TABLA */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

thead{
  background:#fde7f1;
}

th,td{
  padding:12px;
  text-align:center;
  font-size:14px;
}

tbody tr:nth-child(even){
  background:#fafafa;
}

.btn-delete{
  background:#ff4d4d;
  color:#fff;
  border:none;
  padding:8px 14px;
  border-radius:12px;
  cursor:pointer;
  font-size:13px;
}
</style>
</head>

<body>

<div class="admin-card">

  <div class="admin-header">
    <h2>Panel Administrador</h2>
    <p>Gestión de citas del salón</p>
  </div>

  <!-- LOGIN -->
  <div class="login-box">
    <input type="password" id="pass" placeholder="Contraseña admin">
    <button onclick="login()">Entrar</button>
  </div>

  <!-- PANEL -->
  <div id="panel" class="hidden">

    <div class="panel-section">
      <h3>Nueva cita</h3>
      <div class="form-grid">
        <input id="nombre" placeholder="Cliente">
        <input type="date" id="fecha" onchange="cargarHorarios()">

        <!-- HORARIO DESPLEGABLE -->
        <select id="hora">
          <option value="">Selecciona horario</option>
        </select>

        <input id="servicio" placeholder="Servicio">
        <button onclick="crear()">Guardar cita</button>
      </div>
    </div>

    <div class="panel-section">
      <h3>Citas registradas</h3>
      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Servicio</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>

  </div>
</div>

<script>
const PASS='12345678910';
const HORARIOS=['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];

function login(){
 if(document.getElementById('pass').value!==PASS){
   alert('Contraseña incorrecta');
   return;
 }
 document.getElementById('panel').classList.remove('hidden');
 cargar();
}

function cargarHorarios(){
 const fecha=document.getElementById('fecha').value;
 const select=document.getElementById('hora');
 select.innerHTML='<option value="">Selecciona horario</option>';

 let citas=JSON.parse(localStorage.getItem('citas'))||[];

 HORARIOS.forEach(h=>{
   const ocupado=citas.some(c=>c.fecha===fecha && c.hora===h);
   if(!ocupado){
     const opt=document.createElement('option');
     opt.value=h;
     opt.textContent=h;
     select.appendChild(opt);
   }
 });
}

function crear(){
 const fecha=document.getElementById('fecha').value;
 const hora=document.getElementById('hora').value;

 let citas=JSON.parse(localStorage.getItem('citas'))||[];
 const existe=citas.some(c=>c.fecha===fecha && c.hora===hora);

 if(existe){
   alert('⚠️ Ya tiene una cita para ese horario');
   return;
 }

 const cita={
  id:Date.now(),
  nombre:document.getElementById('nombre').value,
  servicio:document.getElementById('servicio').value,
  fecha:fecha,
  hora:hora
 };

 citas.push(cita);
 localStorage.setItem('citas',JSON.stringify(citas));
 cargar();
 cargarHorarios();
}

function cargar(){
 const tb=document.getElementById('tabla');
 tb.innerHTML='';
 let citas=JSON.parse(localStorage.getItem('citas'))||[];
 citas.forEach(c=>{
  tb.innerHTML+=`
   <tr>
     <td>${c.nombre}</td>
     <td>${c.servicio}</td>
     <td>${c.fecha}</td>
     <td>${c.hora}</td>
     <td>
       <button class="btn-delete" onclick="eliminar(${c.id})">
         Eliminar
       </button>
     </td>
   </tr>`;
 });
}

function eliminar(id){
 if(!confirm('¿Deseas eliminar esta cita?')) return;

 let citas=JSON.parse(localStorage.getItem('citas'))||[];
 citas=citas.filter(c=>c.id!==id);
 localStorage.setItem('citas',JSON.stringify(citas));
 cargar();
 cargarHorarios();
}

</script>

</body>
</html>
