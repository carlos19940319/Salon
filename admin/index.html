<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Administrador</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Poppins, Arial, sans-serif;
  background:linear-gradient(135deg,#ff2f92,#ff77b7);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.admin-card{
  background:#fff;
  width:100%;
  max-width:950px;
  border-radius:24px;
  box-shadow:0 20px 45px rgba(0,0,0,.25);
  padding:30px 40px;
}

@media(max-width:768px){
  .admin-card{
    border-radius:0;
    min-height:100vh;
    padding:20px;
  }
}

.admin-header{text-align:center;margin-bottom:25px}
.admin-header h2{margin:0;font-size:28px;font-weight:800;color:#e60073}
.admin-header p{margin-top:6px;color:#666}

.login-box{display:flex;gap:10px;justify-content:center;margin:25px 0}
.login-box input{padding:12px 16px;border-radius:14px;border:1px solid #ddd;font-size:16px}
.login-box button{background:#e60073;color:#fff;border:none;padding:12px 20px;border-radius:14px;font-weight:600;cursor:pointer}

.hidden{display:none}

.dashboard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:16px;
  margin-bottom:30px;
}

.dash-card{
  background:linear-gradient(135deg,#fde7f1,#fff);
  border-radius:18px;
  padding:18px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.dash-card span{font-size:14px;color:#666}
.dash-card strong{display:block;font-size:32px;font-weight:800;color:#e60073}
.dash-card.confirmada strong{color:#2ecc71}
.dash-card.pendiente strong{color:#f1c40f}

.panel-section{margin-top:30px}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-bottom:20px;
}

.form-grid input,
.form-grid select{
  padding:12px;
  border-radius:14px;
  border:1px solid #ddd;
  font-size:15px;
}

.form-grid button{
  grid-column:1/-1;
  background:linear-gradient(135deg,#ff2f92,#ff77b7);
  color:#fff;
  border:none;
  padding:14px;
  border-radius:18px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

#buscar{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:1px solid #ddd;
  margin-bottom:15px;
}

table{width:100%;border-collapse:collapse;margin-top:10px}
thead{background:#fde7f1}
th,td{padding:12px;text-align:center;font-size:14px}
tbody tr:nth-child(even){background:#fafafa}

.btn-delete{
  background:#ff4d4d;color:#fff;border:none;
  padding:6px 10px;border-radius:10px;cursor:pointer
}

.btn-wa{
  background:#25D366;color:#fff;border:none;
  padding:6px 10px;border-radius:10px;cursor:pointer
}

/* CALENDARIO */
.cal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.cal-head button{
  background:#e60073;
  color:#fff;
  border:none;
  padding:6px 12px;
  border-radius:10px;
  cursor:pointer;
}

#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
}

.cal-day{
  background:#fff;
  border-radius:14px;
  padding:8px;
  min-height:90px;
  box-shadow:0 6px 16px rgba(0,0,0,.1);
  cursor:pointer;
}

.cal-day h4{
  margin:0;
  font-size:12px;
  color:#e60073;
}

.event{
  margin-top:4px;
  font-size:11px;
  padding:3px 6px;
  border-radius:8px;
  color:#fff;
}

.event.pendiente{background:#f1c40f}
.event.confirmada{background:#2ecc71}
.event.cancelada{background:#e74c3c}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-content{
  background:#fff;
  border-radius:18px;
  padding:20px;
  width:90%;
  max-width:420px;
}

.modal-content h3{
  text-align:center;
  color:#e60073;
  margin-top:0;
}

.modal-content input,
.modal-content select{
  width:100%;
  margin-bottom:10px;
  padding:10px;
  border-radius:12px;
  border:1px solid #ddd;
}

.modal-content button{
  width:100%;
  background:#e60073;
  color:#fff;
  border:none;
  padding:12px;
  border-radius:14px;
  font-weight:700;
}
</style>
</head>

<body>

<div class="admin-card">

  <div class="admin-header">
    <h2>Panel Administrador</h2>
    <p>Gestión de citas del salón</p>
  </div>

  <!-- LOGIN -->
  <div class="login-box">
    <input type="password" id="pass" placeholder="Contraseña admin">
    <button onclick="login()">Entrar</button>
  </div>

  <!-- PANEL -->
  <div id="panel" class="hidden">

    <!-- DASHBOARD -->
    <div class="dashboard">
      <div class="dash-card"><span>Hoy</span><strong id="d-hoy">0</strong></div>
      <div class="dash-card"><span>Total</span><strong id="d-total">0</strong></div>
      <div class="dash-card confirmada"><span>Confirmadas</span><strong id="d-ok">0</strong></div>
      <div class="dash-card pendiente"><span>Pendientes</span><strong id="d-pend">0</strong></div>
    </div>

    <!-- CALENDARIO -->
    <div class="panel-section">
      <h3>Calendario</h3>
      <div class="cal-head">
        <button onclick="cambiarMes(-1)">◀</button>
        <strong id="mesActual"></strong>
        <button onclick="cambiarMes(1)">▶</button>
      </div>
      <div id="calendar"></div>
    </div>

    <!-- FORM -->
    <div class="panel-section">
      <h3>Nueva cita</h3>
      <div class="form-grid">
        <input id="nombre" placeholder="Cliente">
        <input id="whatsapp" placeholder="WhatsApp (10 dígitos)">
        <input type="date" id="fecha" onchange="cargarHorarios()">
        <select id="hora">
          <option value="">Selecciona horario</option>
        </select>
        <select id="servicio">
          <option>Manicure</option>
          <option>Pedicure</option>
          <option>Corte</option>
          <option>Acrílicas</option>
        </select>
        <button onclick="crear()">Guardar cita</button>
      </div>
    </div>

    <!-- LISTA -->
    <div class="panel-section">
      <h3>Citas registradas</h3>
      <input id="buscar" placeholder="Buscar cliente" oninput="cargar()">
      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>WhatsApp</th>
            <th>Servicio</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>

  </div>
</div>

<!-- MODAL EDICIÓN -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Editar cita</h3>
    <input id="editNombre">
    <input id="editWhatsapp">
    <input type="date" id="editFecha">
    <input id="editHora">
    <select id="editEstado">
      <option>pendiente</option>
      <option>confirmada</option>
      <option>cancelada</option>
    </select>
    <button onclick="guardarEdicion()">Guardar cambios</button>
  </div>
</div>

<script>
const PASS='12345678910';
const HORARIOS=['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];

let mes=new Date().getMonth();
let año=new Date().getFullYear();
let editId=null;

const getCitas=()=>JSON.parse(localStorage.getItem('citas'))||[];
const guardar=c=>localStorage.setItem('citas',JSON.stringify(c));

function login(){
 if(document.getElementById('pass').value!==PASS){
   alert('Contraseña incorrecta');
   return;
 }
 document.querySelector('.login-box').style.display='none';
 document.getElementById('panel').classList.remove('hidden');
 cargar();
 renderCalendar();
}

function cargarHorarios(){
 const fecha=document.getElementById('fecha').value;
 const select=document.getElementById('hora');
 select.innerHTML='<option value="">Selecciona horario</option>';
 HORARIOS.forEach(h=>{
   if(!getCitas().some(c=>c.fecha===fecha && c.hora===h)){
     select.innerHTML+=`<option>${h}</option>`;
   }
 });
}

function crear(){
 let citas=getCitas();
 const nombre=document.getElementById('nombre').value;
 const whatsapp=document.getElementById('whatsapp').value;
 const fecha=document.getElementById('fecha').value;
 const hora=document.getElementById('hora').value;
 const servicio=document.getElementById('servicio').value;

 if(!nombre||!whatsapp||!fecha||!hora){
   alert('Completa todos los campos');
   return;
 }

 if(citas.some(c=>c.fecha===fecha && c.hora===hora)){
   alert('Horario ocupado');
   return;
 }

 citas.push({id:Date.now(),nombre,whatsapp,servicio,fecha,hora,estado:'pendiente'});
 guardar(citas);
 cargar();
 renderCalendar();
}

function cargar(){
 let citas=getCitas();
 const buscar=document.getElementById('buscar').value.toLowerCase();
 citas=citas.filter(c=>c.nombre.toLowerCase().includes(buscar));
 actualizarDashboard(citas);

 const tb=document.getElementById('tabla');
 tb.innerHTML='';
 citas.forEach(c=>{
  tb.innerHTML+=`
   <tr>
     <td>${c.nombre}</td>
     <td>${c.whatsapp}</td>
     <td>${c.servicio}</td>
     <td>${c.fecha}</td>
     <td>${c.hora}</td>
     <td>${c.estado}</td>
     <td>
       <button class="btn-wa" onclick="wa(${c.id})">📲</button>
       <button class="btn-delete" onclick="eliminar(${c.id})">🗑</button>
     </td>
   </tr>`;
 });
}

function eliminar(id){
 if(!confirm('¿Eliminar cita?'))return;
 guardar(getCitas().filter(c=>c.id!==id));
 cargar();
 renderCalendar();
}

function wa(id){
 const c=getCitas().find(x=>x.id===id);
 const msg=`Hola ${c.nombre}, tu cita de ${c.servicio} el ${c.fecha} a las ${c.hora} está ${c.estado}. 💖`;
 window.open(`https://wa.me/52${c.whatsapp}?text=${encodeURIComponent(msg)}`);
}

function actualizarDashboard(c){
 const hoy=new Date().toISOString().split('T')[0];
 document.getElementById('d-hoy').textContent=c.filter(x=>x.fecha===hoy).length;
 document.getElementById('d-total').textContent=c.length;
 document.getElementById('d-ok').textContent=c.filter(x=>x.estado==='confirmada').length;
 document.getElementById('d-pend').textContent=c.filter(x=>x.estado==='pendiente').length;
}

function cambiarMes(dir){
 mes+=dir;
 if(mes<0){mes=11;año--}
 if(mes>11){mes=0;año++}
 renderCalendar();
}

function renderCalendar(){
 const cal=document.getElementById('calendar');
 const label=document.getElementById('mesActual');
 cal.innerHTML='';
 const base=new Date(año,mes,1);
 label.textContent=base.toLocaleDateString('es',{month:'long',year:'numeric'});

 const inicio=base.getDay();
 const dias=new Date(año,mes+1,0).getDate();

 for(let i=0;i<inicio;i++) cal.innerHTML+='<div></div>';

 for(let d=1;d<=dias;d++){
  const fecha=`${año}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const eventos=getCitas().filter(c=>c.fecha===fecha);
  cal.innerHTML+=`
   <div class="cal-day" onclick="abrirEdicion('${fecha}')">
     <h4>${d}</h4>
     ${eventos.map(e=>`<div class="event ${e.estado}">${e.hora} ${e.nombre}</div>`).join('')}
   </div>`;
 }
}

function abrirEdicion(fecha){
 const c=getCitas().find(x=>x.fecha===fecha);
 if(!c) return;
 editId=c.id;
 document.getElementById('modal').style.display='flex';
 document.getElementById('editNombre').value=c.nombre;
 document.getElementById('editWhatsapp').value=c.whatsapp;
 document.getElementById('editFecha').value=c.fecha;
 document.getElementById('editHora').value=c.hora;
 document.getElementById('editEstado').value=c.estado;
}

function guardarEdicion(){
 let citas=getCitas();
 let c=citas.find(x=>x.id===editId);
 c.nombre=document.getElementById('editNombre').value;
 c.whatsapp=document.getElementById('editWhatsapp').value;
 c.fecha=document.getElementById('editFecha').value;
 c.hora=document.getElementById('editHora').value;
 c.estado=document.getElementById('editEstado').value;
 guardar(citas);
 document.getElementById('modal').style.display='none';
 cargar();
 renderCalendar();
}
</script>

</body>
</html>
