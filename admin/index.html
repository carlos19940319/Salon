<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Administrador</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ===== ESTILO ADMIN PRO ===== */
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Poppins, Arial, sans-serif;
  background:linear-gradient(135deg,#ff2f92,#ff77b7);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.admin-card{
  background:#fff;
  width:100%;
  max-width:950px;
  border-radius:24px;
  box-shadow:0 20px 45px rgba(0,0,0,.25);
  padding:30px 40px;
}

.admin-header{
  text-align:center;
  margin-bottom:25px;
}

.admin-header h2{
  margin:0;
  font-size:28px;
  font-weight:800;
  color:#e60073;
}

.admin-header p{
  margin-top:6px;
  color:#666;
}

/* LOGIN */
.login-box{
  display:flex;
  gap:10px;
  justify-content:center;
  margin:25px 0;
}

.login-box input{
  padding:12px 16px;
  border-radius:14px;
  border:1px solid #ddd;
  font-size:16px;
}

.login-box button{
  background:#e60073;
  color:#fff;
  border:none;
  padding:12px 20px;
  border-radius:14px;
  font-weight:600;
  cursor:pointer;
}

/* PANEL */
.hidden{display:none}

/* DASHBOARD */
.dashboard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:16px;
  margin-bottom:30px;
}

.dash-card{
  background:linear-gradient(135deg,#fde7f1,#fff);
  border-radius:18px;
  padding:18px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.dash-card span{
  font-size:14px;
  color:#666;
}

.dash-card strong{
  display:block;
  font-size:32px;
  font-weight:800;
  color:#e60073;
}

.dash-card.confirmada strong{color:#2ecc71}
.dash-card.pendiente strong{color:#f1c40f}

/* FORM */
.panel-section{margin-top:30px}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-bottom:20px;
}

.form-grid input,
.form-grid select{
  padding:12px;
  border-radius:14px;
  border:1px solid #ddd;
  font-size:15px;
}

.form-grid button{
  grid-column:1/-1;
  background:linear-gradient(135deg,#ff2f92,#ff77b7);
  color:#fff;
  border:none;
  padding:14px;
  border-radius:18px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

/* FILTRO */
#buscar{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:1px solid #ddd;
  margin-bottom:15px;
}

/* TABLA */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

thead{background:#fde7f1}

th,td{
  padding:12px;
  text-align:center;
  font-size:14px;
}

tbody tr:nth-child(even){background:#fafafa}

.btn-delete{
  background:#ff4d4d;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:10px;
  cursor:pointer;
}

.btn-wa{
  background:#25D366;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="admin-card">

  <div class="admin-header">
    <h2>Panel Administrador</h2>
    <p>Gestión de citas del salón</p>
  </div>

  <!-- LOGIN -->
  <div class="login-box">
    <input type="password" id="pass" placeholder="Contraseña admin">
    <button onclick="login()">Entrar</button>
  </div>

  <!-- PANEL -->
  <div id="panel" class="hidden">

    <!-- DASHBOARD -->
    <div class="dashboard">
      <div class="dash-card"><span>Hoy</span><strong id="d-hoy">0</strong></div>
      <div class="dash-card"><span>Total</span><strong id="d-total">0</strong></div>
      <div class="dash-card confirmada"><span>Confirmadas</span><strong id="d-ok">0</strong></div>
      <div class="dash-card pendiente"><span>Pendientes</span><strong id="d-pend">0</strong></div>
    </div>

    <!-- FORM -->
    <div class="panel-section">
      <h3>Nueva cita</h3>
      <div class="form-grid">
        <input id="nombre" placeholder="Cliente">
        <input type="date" id="fecha" onchange="cargarHorarios()">

        <select id="hora">
          <option value="">Selecciona horario</option>
        </select>

        <select id="servicio">
          <option>Manicure</option>
          <option>Pedicure</option>
          <option>Corte</option>
          <option>Acrílicas</option>
        </select>

        <button onclick="crear()">Guardar cita</button>
      </div>
    </div>

    <!-- LISTA -->
    <div class="panel-section">
      <h3>Citas registradas</h3>

      <input id="buscar" placeholder="Buscar cliente" oninput="cargar()">

      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Servicio</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>

  </div>
</div>

<script>
const PASS='12345678910';
const HORARIOS=['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];

function login(){
 if(document.getElementById('pass').value!==PASS){
   alert('Contraseña incorrecta');
   return;
 }
 document.getElementById('panel').classList.remove('hidden');
 cargar();
}

function cargarHorarios(){
 const fecha=fechaInput().value;
 const select=horaInput();
 select.innerHTML='<option value="">Selecciona horario</option>';
 let citas=getCitas();
 HORARIOS.forEach(h=>{
   if(!citas.some(c=>c.fecha===fecha && c.hora===h)){
     select.innerHTML+=`<option>${h}</option>`;
   }
 });
}

function crear(){
 let citas=getCitas();
 const fecha=fechaInput().value;
 const hora=horaInput().value;

 if(citas.some(c=>c.fecha===fecha && c.hora===hora)){
   alert('⚠️ Horario ocupado');
   return;
 }

 citas.push({
   id:Date.now(),
   nombre:nombreInput().value,
   servicio:servicioInput().value,
   fecha, hora,
   estado:'pendiente'
 });

 guardar(citas);
 cargar();
 cargarHorarios();
}

function cargar(){
 let citas=getCitas();
 const buscar=document.getElementById('buscar').value.toLowerCase();
 citas=citas.filter(c=>c.nombre.toLowerCase().includes(buscar));
 citas.sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.hora.localeCompare(b.hora));

 actualizarDashboard(citas);

 const tb=document.getElementById('tabla');
 tb.innerHTML='';
 citas.forEach(c=>{
  tb.innerHTML+=`
   <tr>
     <td>${c.nombre}</td>
     <td>${c.servicio}</td>
     <td>${c.fecha}</td>
     <td>${c.hora}</td>
     <td>
       <select onchange="estado(${c.id},this.value)">
         <option ${c.estado==='pendiente'?'selected':''}>pendiente</option>
         <option ${c.estado==='confirmada'?'selected':''}>confirmada</option>
         <option ${c.estado==='cancelada'?'selected':''}>cancelada</option>
       </select>
     </td>
     <td>
       <button class="btn-wa" onclick="wa(${c.id})">📲</button>
       <button class="btn-delete" onclick="eliminar(${c.id})">🗑</button>
     </td>
   </tr>`;
 });
}

function estado(id,val){
 let citas=getCitas().map(c=>c.id===id?{...c,estado:val}:c);
 guardar(citas);
 cargar();
}

function wa(id){
 const c=getCitas().find(x=>x.id===id);
 const msg=`Hola ${c.nombre}, tu cita de ${c.servicio} el ${c.fecha} a las ${c.hora} está ${c.estado}. 💖`;
 window.open(`https://wa.me/527221383605?text=${encodeURIComponent(msg)}`);
}

function eliminar(id){
 if(!confirm('¿Eliminar cita?'))return;
 guardar(getCitas().filter(c=>c.id!==id));
 cargar();
}

function actualizarDashboard(c){
 const hoy=new Date().toISOString().split('T')[0];
 document.getElementById('d-hoy').textContent=c.filter(x=>x.fecha===hoy).length;
 document.getElementById('d-total').textContent=c.length;
 document.getElementById('d-ok').textContent=c.filter(x=>x.estado==='confirmada').length;
 document.getElementById('d-pend').textContent=c.filter(x=>x.estado==='pendiente').length;
}

const getCitas=()=>JSON.parse(localStorage.getItem('citas'))||[];
const guardar=c=>localStorage.setItem('citas',JSON.stringify(c));
const nombreInput=()=>document.getElementById('nombre');
const fechaInput=()=>document.getElementById('fecha');
const horaInput=()=>document.getElementById('hora');
const servicioInput=()=>document.getElementById('servicio');
</script>

</body>
</html>
